name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx expo config --type public
