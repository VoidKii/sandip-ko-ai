name: iOS simulator build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1

      - name: Install JavaScript dependencies and native llama binaries
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build app for iOS Simulator
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c 'import json,sys; d=json.load(sys.stdin); schemes=d["workspace"]["schemes"]; matches=[s for s in schemes if s.lower()=="sandipkoai"]; print(matches[0] if matches else next((s for s in schemes if "sandip" in s.lower()), ""))')"
          if [ -z "$SCHEME" ]; then
            echo "Could not find the app scheme. Available schemes:"
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          echo "Building scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
          find build/Build/Products/Debug-iphonesimulator -maxdepth 2 -name '*.app' -print

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: sandip-ko-ai-ios-simulator
          path: build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
